<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="OpenPaw screenshot">
  <rect width="960" height="600" fill="#1e1e1e"/>
  <rect x="0" y="0" width="960" height="44" fill="#2d2d30"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>
  <text x="120" y="28" fill="#d4d4d4" font-family="Segoe UI, sans-serif" font-size="14">OpenPaw — 自然语言图片编辑工作站</text>
  <!-- left column: mask + seg -->
  <rect x="0" y="44" width="200" height="430" fill="#252526"/>
  <text x="16" y="76" fill="#4ec9b0" font-family="Segoe UI, sans-serif" font-size="13">蒙版工具</text>
  <text x="16" y="102" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="12">▢ 矩形</text>
  <text x="16" y="126" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="12">◯ 圆形</text>
  <text x="16" y="150" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="12">⬟ 多边形</text>
  <text x="16" y="174" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="12">◐ 渐变</text>
  <text x="16" y="198" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="12">🪶 羽化</text>
  <text x="16" y="240" fill="#4ec9b0" font-family="Segoe UI, sans-serif" font-size="13">分割模型</text>
  <rect x="12" y="254" width="176" height="30" rx="5" fill="#094771"/>
  <text x="20" y="274" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12">☁️ skyseg_v1</text>
  <rect x="12" y="290" width="176" height="30" rx="5" fill="#3c3c3c"/>
  <text x="20" y="310" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="12">🧍 humanseg_v1</text>
  <!-- center canvas -->
  <rect x="200" y="44" width="560" height="430" fill="#151515"/>
  <rect x="270" y="90" width="420" height="330" rx="4" fill="#3e3e42"/>
  <text x="480" y="270" fill="#007acc" font-family="Segoe UI, sans-serif" font-size="56" text-anchor="middle">🖼️</text>
  <text x="480" y="330" fill="#808080" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">原图 / 结果对比 · 滑动模式</text>
  <line x1="480" y1="90" x2="480" y2="420" stroke="#4ec9b0" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- right column: adjust + dsl -->
  <rect x="760" y="44" width="200" height="430" fill="#252526"/>
  <text x="776" y="76" fill="#4ec9b0" font-family="Segoe UI, sans-serif" font-size="13">调整</text>
  <text x="776" y="102" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="12">亮度</text>
  <rect x="776" y="110" width="168" height="4" fill="#3e3e42"/><circle cx="860" cy="112" r="6" fill="#007acc"/>
  <text x="776" y="140" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="12">饱和度</text>
  <rect x="776" y="148" width="168" height="4" fill="#3e3e42"/><circle cx="900" cy="150" r="6" fill="#007acc"/>
  <text x="776" y="180" fill="#cccccc" font-family="Segoe UI, sans-serif" font-size="12">对比度</text>
  <rect x="776" y="188" width="168" height="4" fill="#3e3e42"/><circle cx="840" cy="190" r="6" fill="#007acc"/>
  <text x="776" y="238" fill="#4ec9b0" font-family="Segoe UI, sans-serif" font-size="13">DSL 编辑器</text>
  <rect x="776" y="250" width="168" height="200" rx="4" fill="#1e1e1e" stroke="#3e3e42"/>
  <text x="784" y="274" fill="#9cdcfe" font-family="Consolas, monospace" font-size="11">src = $ : (img_scene("sky") &gt; 0.5)</text>
  <text x="784" y="294" fill="#9cdcfe" font-family="Consolas, monospace" font-size="11">sky = src |&gt; skyseg()</text>
  <text x="784" y="314" fill="#dcdcaa" font-family="Consolas, monospace" font-size="11">sky = feather(sky, 15)</text>
  <text x="784" y="334" fill="#9cdcfe" font-family="Consolas, monospace" font-size="11">result = src |&gt;</text>
  <text x="784" y="354" fill="#9cdcfe" font-family="Consolas, monospace" font-size="11">  apply_mask(sky,</text>
  <text x="784" y="374" fill="#9cdcfe" font-family="Consolas, monospace" font-size="11">    adjust(hue=15))</text>
  <text x="784" y="394" fill="#dcdcaa" font-family="Consolas, monospace" font-size="11">save(result, "output/")</text>
  <!-- bottom filmstrip -->
  <rect x="0" y="474" width="960" height="126" fill="#252526"/>
  <text x="16" y="500" fill="#4ec9b0" font-family="Segoe UI, sans-serif" font-size="12">输入 / 输出胶片条</text>
  <g>
    <rect x="16" y="512" width="90" height="70" rx="4" fill="#3e3e42"/><text x="61" y="552" font-size="20" text-anchor="middle">✅</text>
    <rect x="118" y="512" width="90" height="70" rx="4" fill="#3e3e42"/><text x="163" y="552" font-size="20" text-anchor="middle">✅</text>
    <rect x="220" y="512" width="90" height="70" rx="4" fill="#3e3e42"/><text x="265" y="552" font-size="20" text-anchor="middle">⏳</text>
    <rect x="322" y="512" width="90" height="70" rx="4" fill="#3e3e42"/><text x="367" y="552" font-size="20" text-anchor="middle">✅</text>
    <rect x="424" y="512" width="90" height="70" rx="4" fill="#3e3e42"/><text x="469" y="552" font-size="20" text-anchor="middle">❌</text>
    <rect x="526" y="512" width="90" height="70" rx="4" fill="#3e3e42"/><text x="571" y="552" font-size="20" text-anchor="middle">⚪</text>
    <rect x="628" y="512" width="90" height="70" rx="4" fill="#3e3e42"/><text x="673" y="552" font-size="20" text-anchor="middle">✅</text>
  </g>
</svg>
